[package]
name = "openclaw-workbench-desktop"
version = "0.1.0"
description = "Minimal Windows desktop shell for OpenClaw Workbench"
authors = ["OpenClaw Workbench contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "openclaw_workbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
