name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm test
      - run: npm pack --dry-run
      - run: git diff --check

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Windows runtime compatibility
        run: npm test -- --test-name-pattern="CLI|Windows|OpenClaw 诊断|Gateway|MCP|模型|配置|红队|终端执行需要|审批后执行命令|命令失败、超时和取消|控制面提供健康|审批请求不能用 currentRevision|工作区内容 revision|明确审批后完成 Patch"
      - run: git diff --check
