name: CI

on:
  push:
    branches: [main, codex/mcp-streamable-bridge]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm test
      - run: npm pack --dry-run
      - run: git diff --check

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm install --ignore-scripts --package-lock=false
      - name: Windows runtime compatibility
        run: npm test -- --test-name-pattern="CLI|Windows|OpenClaw 诊断|Gateway|MCP|模型|配置|红队|终端执行需要|审批后执行命令|命令失败、超时和取消|控制面提供健康|审批请求不能用 currentRevision|工作区内容 revision|明确审批后完成 Patch"
      - name: Windows desktop Rust checks
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - run: cargo test --manifest-path desktop/Cargo.toml
      - name: Desktop contract checks
        run: node --test tests/desktop-frontend.test.mjs tests/desktop-packaging.test.mjs
      - name: Build Windows desktop installers
        run: npx --yes @tauri-apps/cli@2.12.1 build --ci
        working-directory: desktop
      - name: Verify Windows installer outputs
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "desktop/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Path "desktop/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
          if (-not $msi) { throw "Tauri MSI output was not produced" }
          if (-not $nsis) { throw "Tauri NSIS installer output was not produced" }
          $msi | Select-Object FullName, Length
          $nsis | Select-Object FullName, Length
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-workbench-windows-installers
          path: |
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - run: git diff --check
